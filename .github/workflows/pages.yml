name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'schemas/**', 'tools/packs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build (service worker cache version + badge)
        run: |
          SHA=${GITHUB_SHA::7}; DATE=$(date -u +%Y-%m-%d)
          sed -i "s/const VERSION = 'sc-dev';/const VERSION = 'sc-$SHA';/" site/sw.js
          grep -q "sc-$SHA" site/sw.js
          printf '{"sha": "%s", "date": "%s"}\n' "$SHA" "$DATE" > site/build.json
      - name: Pin the shipped shim pack to the files being deployed (stale pins made the pack loader refuse data/syntax.json -> empty Syntax view)
        run: |
          python3 tools/packs/shim.py
          python3 tools/packs/shim.py --check
      - name: Publish craftpack schemas under the site (docs/PACK_SPEC.md 14.2, so the $id URLs resolve)
        run: |
          mkdir -p site/schemas
          cp -r schemas/craftpack site/schemas/craftpack
          test -f site/schemas/craftpack/1/manifest.schema.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
