name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build (service worker cache version + badge)
        run: |
          SHA=${GITHUB_SHA::7}; DATE=$(date -u +%Y-%m-%d)
          sed -i "s/const VERSION = 'sc-dev';/const VERSION = 'sc-$SHA';/" site/sw.js
          grep -q "sc-$SHA" site/sw.js
          printf '{"sha": "%s", "date": "%s"}\n' "$SHA" "$DATE" > site/build.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
